const UI={en:{h:"Mama Bhaniya Vrindavan Yatra",s:"Stay: Shree Krishna Pranami Mandir (Kach Mandir). Distances are approximate road km from the previous stop; timings change with season and festivals, so confirm locally. 🔸 = optional · ✚ = suggested addition · 🚗 = outstation vehicle needed (local Vrindavan/Haridwar travel can be booked on the spot). Haridwar distances are approximate from central Haridwar.",k:"km",dy:"Day",rt:"Back to stay",im:"Photos",mp:"Map",vh:"🚗 Long-distance day: book a private cab/tempo traveller. Fix fare, waiting hours and stops in advance.",b:"ગુજરાતી"},
gu:{h:"મામા ભાણિયા વૃંદાવન યાત્રા",s:"નિવાસ: શ્રી કૃષ્ણ પ્રણામી મંદિર (કાચ મંદિર). અંતર અંદાજિત છે (પાછલા સ્થળથી કિમી). મંદિરના સમય ઋતુ/તહેવાર પ્રમાણે બદલાય છે, સ્થાનિક રીતે ખાતરી કરો. 🔸 = વૈકલ્પિક · ✚ = સૂચવેલ ઉમેરો · 🚗 = બહારગામ વાહન જરૂરી (વૃંદાવન/હરિદ્વારમાં સ્થાનિક મુસાફરી સ્થળ પર બુક થઈ શકે). હરિદ્વારના અંતર મધ્ય હરિદ્વારથી અંદાજિત છે.",k:"કિમી",dy:"દિવસ",rt:"રહેઠાણ પર પાછા",im:"ફોટા",mp:"નકશો",vh:"🚗 લાંબુ અંતર: ખાનગી કેબ/ટેમ્પો ટ્રાવેલર બુક કરો. ભાડું, વેઇટિંગ અને સ્ટોપ અગાઉથી નક્કી કરો.",b:"English"}};

const D=[
{d:"6 Nov",t:["Vrindavan Parikrama","વૃંદાવન પરિક્રમા"],tip:["Start early morning; most temples close ~12:00-4:30 pm. Prem Mandir lights are best after sunset (till ~8:30 pm). Parikrama marg is ~10 km, can be walked barefoot.","વહેલી સવારે શરૂ કરો; મોટાભાગના મંદિર બપોરે ~12 થી 4:30 બંધ. પ્રેમ મંદિરની રોશની સાંજે શ્રેષ્ઠ."],p:[
["Kaliya Daah","કાલિય દહ",4,"Where Krishna danced on the serpent Kaliya. Devotees bathe/sprinkle Yamuna water and see the Kadamba tree."],
["Radha Madan Mohanji Mandir","રાધા મદન મોહનજી મંદિર",1,"One of the oldest Vrindavan temples, founded by Sanatan Goswami. Offer tulsi and take darshan."],
["Imli Tala","ઇમલી તલા",1.5,"Ancient tamarind tree where Krishna is said to have grieved separation from Radha; Mahaprabhu Chaitanya rested here."],
["Yugal Ghat","યુગલ ઘાટ",1,"Sacred Yamuna ghat of Radha-Krishna. Devotees take snan, offer diya and Yamuna aarti."],
["Jagannathji Mandir","જગન્નાથજી મંદિર",1.5,"Temple of Lord Jagannath. Prasad is offered; darshan is calm and short."],
["Tatiya Sthan","ટટિયા સ્થાન",1.5,"Peaceful ashram of Swami Haridas tradition; no idols decoration, sit for kirtan and silence."],
["ISKCON Mandir","ઇસ્કોન મંદિર",3,"Krishna-Balaram Mandir. Chant Hare Krishna; midday break ~1-4:15 pm, evening aarti ~7 pm."],
["Prem Mandir","પ્રેમ મંદિર",4,"Marble temple of Radha-Krishna and Sita-Ram. Evening light show; leave footwear at counter."]]},
{d:"7 Nov",t:["Barsana & Nandgaon","બરસાણા અને નંદગાંવ"],tip:["Barsana is ~50 km (1.5 hr) from Vrindavan. Leave by 5:30 am; Shreeji Mandir has ~250 steps and a midday break. Do Nandgaon after lunch.","બરસાણા ~50 કિમી. સવારે 5:30 વાગ્યે નીકળો; શ્રીજી મંદિરમાં ~250 પગથિયાં, બપોરે બંધ. નંદગાંવ લંચ પછી."],p:[
["Sakdi Khor","સાંકડી ખોર",50,"Narrow lane where Krishna teased gopis. Devotees squeeze through it for blessings."],
["Gahvar Van","ગહવર વન",2,"Forest where Radha-Krishna played; peacocks roam freely. Walk the parikrama."],
["Gahvar Kund","ગહવર કુંડ",0.5,"Sacred kund within Gahvar Van; devotees sprinkle its water on head."],
["Maan Mandir","માન મંદિર",1.5,"Temple of Radha's maan (affection-sulk) lila. Peaceful hilltop views."],
["Shree Ladli Mandir / Shreeji Mandir","શ્રી લાડલી મંદિર / શ્રીજી મંદિર",1,"Main temple of Radharani on the hill. Chant 'Radhe Radhe'; Holi lilas celebrated in Feb-Mar."],
["Nand Bhavan","નંદ ભવન",8,"Hilltop home of Nand Baba and Yashoda; Krishna's childhood lila. Take darshan of Nand-Yashoda-Krishna-Balram."],
["Pavan Sarovar","પાવન સરોવર",0.5,"Sacred lake where Krishna watered cows; take a dip or sprinkle water."],
["Vrinda Devi Mandir","વૃંદા દેવી મંદિર",0.5,"Temple of Vrinda Devi (tulsi). Offer tulsi leaves."],
["Charan Pahadi","ચરણ પહાડી",1.5,"Rock with Krishna's footprints (charan chinh). Touch and bow."],
["Ter Kadamb","ટેર કદંબ",1,"Kadamb tree where Krishna played flute to call his cows."],
["Asheshwar Mahadev Mandir","અશેશ્વર મહાદેવ મંદિર",1,"Shiva temple; Lord Shiva is said to have come to see baby Krishna."]]},
{d:"8 Nov",t:["Gokul","ગોકુળ"],tip:["Gokul is ~15 km (45 min) from Vrindavan. Most temples are open 6-12 and 4-8. Wear simple clothing and keep a small tulsi mala.","ગોકુળ ~15 કિમી. મોટાભાગના મંદિર સવારે 6-12 અને સાંજે 4-8 ખુલ્લા."],p:[
["Raval (Radhaji's birthplace)","રાવલ (રાધાજી જન્મસ્થાન)",15,"Birthplace of Shri Radha. Temple of baby Radha; sing birthday-style bhajans."],
["Dauji","દાઉજી",10,"Temple of Balram (Dauji). Takes ~1 hr; famous Dauji prasad."],
["Brahmand Ghat","બ્રહ્માંડ ઘાટ",3,"Where Yashoda saw the universe in baby Krishna's mouth. Ghat on the Yamuna."],
["Chinta Haran Mahadev","ચિંતા હરણ મહાદેવ",1,"Shiva temple said to remove worries. Offer water and bel patra."],
["84 Khambha / Nand Bhavan","84 ખંભા / નંદ ભવન",1.5,"Pillared hall of Nand Baba's palace. Cradle darshan of Lalla."],
["Raman Reti","રમણ રેતી",8,"Sands where Krishna played as a child; devotees roll in or take the sand as blessing."]]},
{d:"9 Nov",t:["Kamvan (Diwali)","કામવન (દિવાળી)"],tip:["Kamvan (Kaman, Rajasthan) is ~85 km (2.5 hr) one way, so leave by 5:30 am. Visit all 84 kunds and Kamyavan stops by noon; plan lunch on the way. Expect Diwali crowds.","કામવન ~85 કિમી (2.5 કલાક); સવારે 5:30 નીકળો. દિવાળી ભીડ સંભવ."],p:[
["Bhojan Sthali","ભોજન સ્થળી",85,"Place where Krishna and gopis took meals. Offer prasad."],
["Vyomeshwar Gufa","વ્યોમેશ્વર ગુફા",0.5,"Cave of Vyomasur's slaying. Short visit with some stairs."],
["Fisalni Shila","ફિસલની શિલા",0.5,"Slippery rock Krishna slid on. Devotees touch it with reverence."],
["Kameshwar Mahadev","કામેશ્વર મહાદેવ",0.5,"Ancient Shiva Linga. Offer water and bel patra."],
["Charan Pahadi","ચરણ પહાડી",1,"Krishna's footprints in rock."],
["Vimla Kund","વિમલા કુંડ",0.5,"Sacred kund of Vimla Devi; bath or sprinkle holy water."],
["Gaya Kund","ગયા કુંડ",0.5,"Pind-daan for ancestors can be done here, by tradition."],
["Aadi Badrinath","આદિ બદ્રીનાથ",0.5,"Believed to be equal to Badrinath darshan."],
["Gangotri & Yamnotri Mandir","ગંગોત્રી અને યમનોત્રી મંદિર",0.5,"Symbolic Char Dham in Vraj."],
["Kedarnath","કેદારનાથ",0.5,"Symbolic Kedarnath darshan."],
["Mahaprabhuji Bethak","મહાપ્રભુજી બેઠક",1,"Seat of Shri Vallabhacharya (Pushtimarg); bow at the bethak."]]},
{d:"10 Nov",t:["Govardhan Puja & Parikrama","ગોવર્ધન પૂજા અને પરિક્રમા"],tip:["Govardhan is ~28 km (1 hr) away. Full parikrama is ~21 km, usually 6-8 hrs on foot. Start before sunrise, carry water and go barefoot. Do Govardhan Puja and annakut darshan first.","ગોવર્ધન ~28 કિમી. આખી પરિક્રમા ~21 કિમી (6-8 કલાક). સૂર્યોદય પહેલા શરૂ કરો."],p:[
["Kusum Sarovar","કુસુમ સરોવર",28,"Beautiful sandstone kund where Radha picked flowers. Evening visit is lovely."],
["Mansi Ganga","માનસી ગંગા",6,"Kund created from Krishna's mind (mansi). Take a dip and offer diya at night."],
["Chakleshwar Mahadev","ચકલેશ્વર મહાદેવ",1,"Shiva temple at the parikrama start. Many pray before starting."],
["Haridevji Mandir","હરિદેવજી મંદિર",1,"Ancient temple of Haridev. Take darshan."],
["Daan Ghati","દાન ઘાટી",1,"Where Krishna asked gopis for 'dan' (toll). Famous for dan-lila."],
["Govind Kund","ગોવિંદ કુંડ",3,"Kund where Indra performed abhishek of Krishna."],
["Puchhdi ka Lota","પૂંછડીનો લોટો",3,"Tail-shaped rock of Govardhan. Devotees touch and bow."],
["Jati Pura","જતીપુરા",3,"Mukharvind of Govardhan; Pushtimarg hub. Special annakut darshan."],
["Uddhav Kund","ઉદ્ધવ કુંડ",2,"Where Uddhav lived as a blade of grass to get gopi-dust."],
["Chaitanya Mahaprabhu Mandir","ચૈતન્ય મહાપ્રભુ મંદિર",2,"Chaitanya's temple, associated with his Govardhan visit."],
["Radha Kund / Shyam Kund","રાધા કુંડ / શ્યામ કુંડ",3,"Holiest kunds of Vraj. Bath here is considered very auspicious, especially on Ahoi Ashtami."]]},
{d:"11 Nov",t:["Yamuna Snan & Mathura (Bhai Bij)","યમુના સ્નાન અને મથુરા (ભાઈબીજ)"],tip:["Bhai Bij is Yamuna-Yam Dwitiya: brothers and sisters bathe at Vishram Ghat/Yugal Ghat. Janmabhumi has strict security (no phones/bags) and a midday break; go early or after 4 pm.","ભાઈબીજ યમુના-યમ દ્વિતીયા છે. જન્મભૂમિમાં કડક સુરક્ષા (ફોન/બેગ નહીં) અને બપોરે બંધ."],p:[
["Yamuna Snan at Yugal Ghat","યમુના સ્નાન યુગલ ઘાટ",4,"Early-morning Yamuna bath. Wear light clothes, keep valuables safe."],
["Bhandir Van","ભાંડીર વન",25,"Where Radha and Krishna were married by Brahma; ancient Bhandir vat."],
["Vanshi Vat","વંશી વટ",1,"Banyan tree where Krishna played flute for the Raas."],
["Maan Sarovar","માન સરોવર",2,"Sacred kund of Radha's maan lila."],
["Dhruv Tila","ધ્રુવ ટીલા",15,"Where Dhruv did tapasya. Peaceful."],
["Dwarkadhish Mandir","દ્વારકાધીશ મંદિર",3,"Famous Mathura temple. Close to Yamuna; Janmashtami is huge, the rest of year peaceful. Closed ~12-4 pm."],
["Janmabhumi","જન્મભૂમિ",1,"Birthplace prison cell of Krishna; Keshav Dev Mandir. Strict security, no phones."]]},
{d:"12 Nov",t:["Vrindavan Mandirs & Departure","વૃંદાવન મંદિર અને પ્રસ્થાન"],tip:["Morning: temples open ~7:30-12. Banke Bihari and Radha Raman are within 1 km of each other; check out by ~1 pm. Haridwar is ~330 km (7-8 hr); night arrival possible.","સવારે મંદિરો ~7:30-12 ખુલ્લા. હરિદ્વાર ~330 કિમી (7-8 કલાક); રાત્રે પહોંચવું."],p:[
["Banke Bihari Mandir","બાંકે બિહારી મંદિર",3,"Most beloved temple. Curtain is opened and closed repeatedly; expect long queues."],
["Radha Raman Mandir","રાધા રમણ મંદિર",1,"Self-manifested Shaligram deity, brought by Gopal Bhatt Goswami."],
["Radha Vallabh Mandir","રાધા વલ્લભ મંદિર",1,"Unique tradition of worshipping Radha-ji; the crown is kept on a throne for Krishna."],
["Nidhivan / Seva Kunj","નિધિવન / સેવા કુંજ",1,"Mystic grove where Krishna still dances Raas at night; no one stays inside after dark."]]},
{d:"13 Nov",t:["Haridwar: Arrival & Ganga Aarti","હરિદ્વાર: આગમન અને ગંગા આરતી"],tip:["Check in and rest. Be at Har Ki Pauri 30-45 min before sunset for Ganga Aarti.","ચેક-ઇન અને આરામ. હર કી પૌડી સૂર્યાસ્તના 30-45 મિનિટ પહેલા પહોંચો."],p:[
["Har Ki Pauri","હર કી પૌડી",3,"Main Ganga ghat. Take a dip, set a diya on the water; evening aarti is the highlight."]]},
{d:"14 Nov",t:["Haridwar Temples","હરિદ્વાર મંદિર"],tip:["Mansa Devi and Chandi Devi both have ropeway rides (closed midday); go early.","માનસા દેવી અને ચંડી દેવી રોપવે (બપોરે બંધ); વહેલા જાઓ."],p:[
["Mansa Devi Mandir","મનસા દેવી મંદિર",3,"Shakti peeth; tie a thread on the tree to make a wish."],
["Chandi Devi Mandir","ચંડી દેવી મંદિર",6,"Hilltop temple of Chandi Devi."],
["Maya Devi Mandir","માયા દેવી મંદિર",5,"Ancient Shakti peeth; one of the oldest in Haridwar."],
["Daksha Mahadev Mandir (Kankhal)","દક્ષ મહાદેવ મંદિર (કનખલ)",5,"Shiva temple at the site of Daksha's yagna."]]},
{d:"15 Nov",t:["Haridwar: Final Snan & Return","હરિદ્વાર: અંતિમ સ્નાન અને પરત"],tip:["Morning Ganga snan at Har Ki Pauri, then shopping for Gangajal/rudraksha.","સવારે હર કી પૌડી ગંગા સ્નાન, પછી ગંગાજળ/રુદ્રાક્ષ ખરીદી."],p:[
["Ganga Snan (Har Ki Pauri)","ગંગા સ્નાન (હર કી પૌડી)",3,"Carry Gangajal home in a sealed container; offer prayers for ancestors if you wish."]]}

const G=[["અહીં શ્રીકૃષ્ણે કાલિય નાગ પર નૃત્ય કર્યું હતું. ભક્તો યમુના જળ છાંટે છે અને કદંબ વૃક્ષ જુએ છે.","વૃંદાવનના સૌથી પ્રાચીન મંદિરોમાંનું એક; સનાતન ગોસ્વામીએ સ્થાપ્યું. તુલસી અર્પણ કરી દર્શન કરો.","પ્રાચીન આમલીનું વૃક્ષ; રાધાજીના વિરહમાં કૃષ્ણ અહીં બેઠા હતા, ચૈતન્ય મહાપ્રભુએ વિશ્રામ કર્યો.","રાધા-કૃષ્ણનો પવિત્ર યમુના ઘાટ. ભક્તો સ્નાન, દીપદાન અને યમુના આરતી કરે છે.","ભગવાન જગન્નાથનું મંદિર; પ્રસાદ ધરાવાય છે, દર્શન શાંત અને ટૂંકા.","સ્વામી હરિદાસ પરંપરાનો શાંત આશ્રમ; કીર્તન અને મૌનમાં બેસો.","કૃષ્ણ-બલરામ મંદિર. હરે કૃષ્ણ જાપ કરો; બપોરે ~1-4:15 બંધ, સાંજે ~7 આરતી.","રાધા-કૃષ્ણ અને સીતા-રામનું આરસનું મંદિર. સાંજે રોશની શો; પગરખાં કાઉન્ટર પર મૂકો."],["સાંકડી ગલી જ્યાં કૃષ્ણ ગોપીઓને સતાવતા. ભક્તો આશીર્વાદ માટે તેમાંથી પસાર થાય છે.","રાધા-કૃષ્ણની લીલાનું વન; મોર ફરે છે. પરિક્રમા કરો.","ગહવર વનનો પવિત્ર કુંડ; જળ માથે છાંટો.","રાધાજીની માન લીલાનું મંદિર; ટેકરી પરથી સુંદર દૃશ્ય.","ટેકરી પરનું રાધારાણીનું મુખ્ય મંદિર. 'રાધે રાધે' બોલો; ફાગણમાં લઠ્ઠમાર હોળી.","નંદબાબા-યશોદાનું ટેકરી પરનું ઘર; નંદ-યશોદા-કૃષ્ણ-બલરામના દર્શન.","જ્યાં કૃષ્ણ ગાયોને પાણી પીવડાવતા; સ્નાન કે જળ છાંટો.","વૃંદા દેવી (તુલસી)નું મંદિર; તુલસીપત્ર ધરાવો.","કૃષ્ણના ચરણચિહ્નવાળો પથ્થર; સ્પર્શ કરી નમન કરો.","જ્યાં કૃષ્ણ વાંસળી વગાડી ગાયોને બોલાવતા.","શિવજી બાળકૃષ્ણના દર્શને આવ્યા હતા તેવી માન્યતા."],["શ્રી રાધાજીનું જન્મસ્થાન; બાળ રાધાના દર્શન.","બલરામજી (દાઉજી)નું મંદિર; દાઉજીનો પ્રસાદ પ્રખ્યાત.","જ્યાં યશોદાએ કૃષ્ણના મુખમાં બ્રહ્માંડ જોયું; યમુના કિનારે ઘાટ.","ચિંતા દૂર કરનાર શિવ મંદિર; જળ અને બિલીપત્ર ધરાવો.","નંદબાબાના મહેલનો થાંભલાવાળો હોલ; લાલાના પારણાના દર્શન.","જ્યાં કૃષ્ણ બાળપણમાં રમ્યા; ભક્તો રેતીમાં આળોટે કે ચપટી રેતી લે."],["કૃષ્ણ-ગોપીઓએ અહીં ભોજન કર્યું હતું; પ્રસાદ ધરાવો.","વ્યોમાસુર વધની ગુફા; થોડા પગથિયાં.","કૃષ્ણ જેના પર લપસ્યા તે શિલા; ભક્તો સ્પર્શ કરે.","પ્રાચીન શિવલિંગ; જળ અને બિલીપત્ર ધરાવો.","પથ્થર પર કૃષ્ણના ચરણચિહ્ન.","વિમલા દેવીનો પવિત્ર કુંડ; સ્નાન કે જળ છાંટો.","પરંપરા મુજબ અહીં પિતૃ પિંડદાન થાય છે.","બદ્રીનાથ દર્શન સમાન ગણાય છે.","વ્રજમાં ચારધામના પ્રતીક દર્શન.","પ્રતીક કેદારનાથ દર્શન.","શ્રી વલ્લભાચાર્યજીની બેઠક (પુષ્ટિમાર્ગ); નમન કરો."],["રાધાજીએ ફૂલ ચૂંટ્યા તે સુંદર કુંડ; સાંજે સુંદર.","કૃષ્ણના મનથી પ્રગટેલો કુંડ; સ્નાન અને રાત્રે દીપદાન.","પરિક્રમા પહેલાં નમન કરાતું શિવ મંદિર.","પ્રાચીન હરિદેવજી મંદિર; દર્શન કરો.","જ્યાં કૃષ્ણે ગોપીઓ પાસે 'દાન' માંગ્યું; દાનલીલા સ્થળ.","જ્યાં ઇન્દ્રે કૃષ્ણનો અભિષેક કર્યો.","ગોવર્ધનનો પૂંછડી આકારનો ભાગ; સ્પર્શ કરી નમન.","ગિરિરાજનું મુખારવિંદ; પુષ્ટિમાર્ગનું કેન્દ્ર, અન્નકૂટ દર્શન.","ઉદ્ધવજી ગોપીઓની ચરણરજ માટે તૃણ રૂપે રહ્યા.","ચૈતન્ય મહાપ્રભુની ગોવર્ધન યાત્રા સાથે જોડાયેલું મંદિર.","વ્રજના સૌથી પવિત્ર કુંડ; સ્નાન અતિ શુભ, ખાસ અહોઈ અષ્ટમીએ."],["વહેલી સવારે યમુના સ્નાન; કીમતી વસ્તુઓ સાચવો.","જ્યાં બ્રહ્માજીએ રાધા-કૃષ્ણના લગ્ન કરાવ્યા; પ્રાચીન ભાંડીર વટ.","જ્યાં કૃષ્ણે રાસ માટે વાંસળી વગાડી તે વડ.","રાધાજીની માન લીલાનો પવિત્ર કુંડ.","જ્યાં ધ્રુવે તપસ્યા કરી; શાંત સ્થળ.","મથુરાનું પ્રસિદ્ધ મંદિર; બપોરે ~12-4 બંધ.","કૃષ્ણનું જન્મસ્થાન (કારાગાર); કડક સુરક્ષા, ફોન નહીં."],["સૌથી પ્રિય મંદિર; પડદો વારંવાર ખૂલે-બંધ થાય, લાંબી લાઇન.","ગોપાલ ભટ્ટ ગોસ્વામીને પ્રગટ થયેલા શાલિગ્રામ સ્વરૂપ.","રાધાજીની ઉપાસનાની અનોખી પરંપરા; ગાદી પર મુકુટ.","માન્યતા છે કે રાત્રે કૃષ્ણ રાસ રમે છે; સાંજ પછી કોઈ રોકાતું નથી."],["મુખ્ય ગંગા ઘાટ; સ્નાન, દીપદાન; સાંજની આરતી ખાસ."]];

D[6].p.push(["Katyayani Shakti Peeth","કાત્યાયની શક્તિપીઠ",2,"One of the 51 Shakti Peeths: Sati's hair fell here (Uma Shakti). Offer red chunri and flowers; special in Navratri.","૫૧ શક્તિપીઠમાંનું એક: સતીના કેશ અહીં પડ્યા હતા. લાલ ચૂંદડી-ફૂલ ધરાવો; નવરાત્રિમાં ખાસ.",1]);
D.splice(8,2,{d:"14 Nov",t:["Rishikesh Day Trip","ઋષિકેશ દિવસ"],tip:["Rishikesh is ~25 km (45 min) from Haridwar. Leave by 6 am if doing optional Kunjapuri sunrise (adds ~3 hrs), else 8 am. Be at Triveni Ghat before sunset for aarti.","ઋષિકેશ ~25 કિમી (45 મિનિટ). કુંજાપુરી સૂર્યોદય કરવો હોય તો સવારે 6 વાગ્યે નીકળો (~3 કલાક વધારે), નહીં તો 8 વાગ્યે. સૂર્યાસ્ત પહેલા ત્રિવેણી ઘાટ પહોંચો."],p:[
["Kunjapuri Devi Shakti Peeth (optional)","કુંજાપુરી દેવી શક્તિપીઠ (વૈકલ્પિક)",45,"Hilltop Shakti Peeth (Sati's chest fell here); sunrise view of the Himalayas. Steep stairs.","ટેકરી પરનું શક્તિપીઠ (સતીનું વક્ષસ્થળ પડ્યું); હિમાલયનું સૂર્યોદય દૃશ્ય. ઊંચા પગથિયાં.",1],
["Ram Jhula & Parmarth Niketan","રામ ઝૂલા અને પરમાર્થ નિકેતન",25,"Iconic suspension bridge; visit Parmarth Niketan ashram and the Ganga bank.","પ્રખ્યાત ઝૂલતો પુલ; પરમાર્થ નિકેતન અને ગંગા કિનારે ચાલો."],
["Laxman Jhula","લક્ષ્મણ ઝૂલા",1.5,"Walking bridge near the 13-storey Tera Manzil temple and Ganga ghats.","ચાલતો ઝૂલતો પુલ; 13 માળના તેરા મંજિલ મંદિર અને ગંગા ઘાટ નજીક."],
["Triveni Ghat","ત્રિવેણી ઘાટ",2,"Holy ghat; evening Ganga aarti, devotees take a dip and float a diya.","પવિત્ર ઘાટ; સાંજે ગંગા આરતી, સ્નાન અને દીપદાન."]]},{d:"15 Nov",t:["Haridwar Full Day & Midnight Return","હરિદ્વાર આખો દિવસ અને મધ્યરાત્રિ પરત"],tip:["Return train/flight is at midnight, so keep luggage at the hotel or station cloakroom after check-out and reach 2 hrs early. Ropeways close midday for a break.","પરત મધ્યરાત્રિએ છે; ચેક-આઉટ પછી સામાન હોટેલ/સ્ટેશન ક્લોકરૂમમાં મૂકો, 2 કલાક વહેલા પહોંચો. રોપવે બપોરે બંધ રહે છે."],p:[

"Prem Mandir":["Built by Kripalu Maharaj and opened in 2012, it shows Radha-Krishna and Sita-Ram lilas in Italian marble. Devotees do darshan and walk around the sculpted lilas, then stay for the evening light and fountain show.","કૃપાલુ મહારાજે બનાવેલું (2012); ઇટાલિયન આરસમાં રાધા-કૃષ્ણ અને સીતા-રામની લીલાઓ. ભક્તો દર્શન-પરિક્રમા કરે છે અને સાંજે રોશની-ફુવારા શો જુએ છે."],
"Banke Bihari Mandir":["Deity of Krishna in tribhanga pose, revealed to Swami Haridas. He is worshipped as a child, so the curtain is opened and closed often. Offer sweets, flowers and tulsi and chant 'Radhe Radhe'; avoid bags and phones in the crowd.","સ્વામી હરિદાસજીને પ્રગટ થયેલા ત્રિભંગી કૃષ્ણ; બાળ સ્વરૂપે પૂજા થતી હોવાથી પડદો વારંવાર ખૂલે-બંધ થાય છે. મીઠાઈ, ફૂલ, તુલસી ધરાવો અને 'રાધે રાધે' બોલો; ભીડમાં બેગ-ફોન ટાળો."],
"Radha Raman Mandir":["The deity self-manifested from a Shaligram stone for Gopal Bhatt Goswami. There is no separate Radha murti; a silk cloth symbolises her. Offer tulsi and take charnamrit.","શાલિગ્રામ શિલામાંથી સ્વયં પ્રગટ થયેલા ઠાકુરજી; અલગ રાધા મૂર્તિ નથી, રેશમી વસ્ત્ર રાધાજીનું પ્રતીક. તુલસી ધરાવી ચરણામૃત લો."],
"Nidhivan / Seva Kunj":["Dense tulsi grove where Radha-Krishna are believed to perform Raas every night, so the gates close at dusk. Devotees visit Rang Mahal, offer tulsi and tie sacred threads.","તુલસીનું ગાઢ વન; માન્યતા છે કે અહીં રાધા-કૃષ્ણ દરરોજ રાત્રે રાસ રમે છે, તેથી સાંજે દરવાજા બંધ થાય છે. રંગ મહેલ દર્શન, તુલસી અર્પણ અને દોરો બાંધવાની પરંપરા."],
"Shree Ladli Mandir / Shreeji Mandir":["Temple of Radharani on Brahma Parvat, reached by ~250 steps. Devotees chant 'Radhe Radhe', offer flowers and laddoo bhog and do the Barsana parikrama. Lathmar Holi is celebrated here.","બ્રહ્મ પર્વત પર રાધારાણીનું મંદિર (~250 પગથિયાં). 'રાધે રાધે' બોલો, ફૂલ-લાડુ ભોગ ધરાવો અને બરસાણા પરિક્રમા કરો; અહીં લઠ્ઠમાર હોળી થાય છે."],
"Nand Bhavan":["Hilltop palace of Nand Baba where Krishna grew up after Gokul. Devotees offer makhan-mishri, take darshan of Nand-Yashoda-Krishna-Balram and celebrate Nandotsav.","નંદબાબાનો ટેકરી પરનો મહેલ; ગોકુળ પછી કૃષ્ણ અહીં ઉછર્યા. માખણ-મિશ્રી ધરાવો, નંદ-યશોદા-કૃષ્ણ-બલરામના દર્શન કરો; નંદોત્સવ ઉજવાય છે."],
"Raval (Radhaji's birthplace)":["Birthplace of Radharani, where she is worshipped as an infant in a cradle. Devotees sing birthday bhajans and offer bhog; Radhashtami is the main festival.","રાધારાણીનું જન્મસ્થાન; બાળ રાધાની પારણામાં પૂજા. જન્મદિનના ભજન ગાઓ, ભોગ ધરાવો; રાધાષ્ટમી મુખ્ય ઉત્સવ."],
"Radha Kund / Shyam Kund":["The holiest kund of Vraj, created by Radha. Devotees bathe or sprinkle water at both kunds, offer diya and walk around them; bathing on Ahoi Ashtami night is especially auspicious.","વ્રજનો સૌથી પવિત્ર કુંડ; રાધાજીએ બનાવેલો. રાધા અને શ્યામ બંને કુંડમાં સ્નાન/જળ છાંટો, દીપ ધરાવો અને પરિક્રમા કરો; અહોઈ અષ્ટમીની રાત્રે સ્નાન ખાસ શુભ."],
"Janmabhumi":["Prison-cell birthplace of Krishna beside the Keshav Dev temple. Devotees take darshan of the cell and sanctum and pray; Janmashtami is the main festival. Phones and bags are not allowed.","કૃષ્ણનું જન્મસ્થાન (કારાગાર) અને કેશવ દેવ મંદિર. ગર્ભગૃહ દર્શન અને પ્રાર્થના; જન્માષ્ટમી મુખ્ય ઉત્સવ. ફોન/બેગ નહીં."],
"Katyayani Shakti Peeth":["Shakti Peeth of Uma Shakti with Bhuteshwar Bhairav, where Sati's hair is said to have fallen. The gopis worshipped Katyayani to get Krishna as their husband. Offer red chunri, flowers and coconut; Navratri is special.","ઉમા શક્તિ અને ભૂતેશ્વર ભૈરવનું શક્તિપીઠ; સતીના કેશ અહીં પડ્યા. ગોપીઓએ કૃષ્ણને પતિ રૂપે મેળવવા કાત્યાયનીની પૂજા કરી; લાલ ચૂંદડી, ફૂલ, નારિયેળ ધરાવો; નવરાત્રિમાં ખાસ."],
"Har Ki Pauri":["Where the Ganga leaves the hills; nectar drops are believed to have fallen here during Kumbh. Devotees bathe, float diya and flowers, perform pind-daan and attend the sunset Ganga aarti.","જ્યાં ગંગા પર્વતોમાંથી મેદાનમાં આવે છે; કુંભમાં અમૃત બિંદુ અહીં પડ્યાં મનાય છે. સ્નાન, દીપ-ફૂલ અર્પણ, પિંડદાન અને સૂર્યાસ્તની ગંગા આરતી."],
"Maya Devi Mandir (Shakti Peeth)":["Ancient temple of Haridwar's presiding goddess, counted among the 51 Shakti Peeths. Offer red chunri, flowers and coconut.","૫૧ શક્તિપીઠમાંનું એક; હરિદ્વારની અધિષ્ઠાત્રી દેવી, પ્રાચીન મંદિર. લાલ ચૂંદડી, ફૂલ, નારિયેળ ચઢાવો અને દર્શન કરો."],
"Mansa Devi Mandir":["Siddh Peeth of the wish-fulfilling goddess. Tie a sacred thread on the tree with a wish and untie it when fulfilled; ropeway or climb.","સિદ્ધ પીઠ; મનોકામના પૂર્ણ કરતી દેવી. વૃક્ષ પર દોરો બાંધી મનોકામના કરો, પૂર્ણ થતાં ખોલો; રોપવે કે પગપાળા."],
